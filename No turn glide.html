<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLIDE Simulation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; }
        .container { background: #2c3e50; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        canvas { background: #34495e; border: 4px solid #444; border-radius: 8px; display: block; }
        .controls { display: flex; gap: 20px; margin-top: 15px; align-items: center; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .stat-box { background: #1a1a1a; padding: 10px; border-radius: 5px; text-align: center; border-bottom: 3px solid #f1c40f; }
        .stat-label { font-size: 10px; color: #bdc3c7; text-transform: uppercase; display: block; margin-bottom: 5px; }
        .stat-value { font-size: 18px; font-weight: bold; color: #f1c40f; display: block; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; transition: 0.2s; }
        .btn-start { background: #27ae60; color: white; }
        .btn-reset { background: #e74c3c; color: white; }
        .formula-tag { font-size: 11px; color: #95a5a6; text-align: center; margin-top: 10px; font-style: italic; }
        #glide-mode { text-align: center; font-size: 12px; font-weight: bold; margin-bottom: 10px; letter-spacing: 2px; color: #2ecc71; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center; margin-bottom: 5px; letter-spacing: 2px;">GLIDE TRAFFIC ADAPTIVE SYSTEM</h2>
        <div id="glide-mode">STATUS: 4-PHASE ITERATIVE CONTROL</div>
        <canvas id="trafficCanvas" width="800" height="800"></canvas>
        
        <div class="controls">
            <button class="btn-start" id="toggleBtn">START SIMULATION</button>
            <button class="btn-reset" id="resetBtn">RESET</button>
            <div style="flex-grow: 1">
                <span style="font-size: 12px; display: block; margin-bottom: 5px;">FLOW DENSITY</span>
                <input type="range" id="spawnControl" min="0.005" max="0.1" step="0.005" value="0.03" style="width: 100%">
            </div>
        </div>

        <div class="stats">
            <div class="stat-box"><span class="stat-label">Active Cars</span><span id="vCount" class="stat-value">0</span></div>
            <div class="stat-box"><span class="stat-label">Network Load</span><span id="vSat" class="stat-value">0%</span></div>
            <div class="stat-box"><span class="stat-label">Congestion</span><span id="vCongestion" class="stat-value">0%</span></div>
            <div class="stat-box"><span class="stat-label">Avg Wait</span><span id="vWait" class="stat-value">0.0s</span></div>
        </div>
        <div class="formula-tag">GLIDE Logic: 1-Second Deterministic Green Nudges. 50% turning probability.</div>
    </div>

<script>
    const canvas = document.getElementById('trafficCanvas');
    const ctx = canvas.getContext('2d');

    const GRID_SIZE = 2; 
    const ROAD_WIDTH = 80;
    const LANE_OFFSET = 20; 
    const CELL_SIZE = canvas.width / GRID_SIZE;
    const FPS = 60;
    
    const MAX_SPEED = 2.4;
    const ACCEL = 0.05;
    const BRAKE_FORCE = 0.2; 
    const REACTION_DIST = 100; 

    let state = {
        running: false,
        vehicles: [],
        intersections: [],
        spawnRate: 0.03,
        exitedCount: 0,
        totalWaitAccumulated: 0,
        totalVehiclesProcessed: 0
    };

    function initIntersections() {
        state.intersections = [];
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                state.intersections.push({
                    x: (c + 0.5) * CELL_SIZE,
                    y: (r + 0.5) * CELL_SIZE,
                    timer: 0,
                    phase: 0, // 0:N-Go, 1:N-Y, 2:S-Go, 3:S-Y, 4:W-Go, 5:W-Y, 6:E-Go, 7:E-Y
                    durations: [240, 60, 240, 60, 240, 60, 240, 60],
                    occ: [0, 0, 0, 0], // N, S, W, E
                    ds: [0, 0, 0, 0],
                    id: r * GRID_SIZE + c
                });
            }
        }
    }

    function applyGlideAdaptive(inter) {
        for(let i=0; i<4; i++) inter.ds[i] = inter.occ[i] / inter.durations[i*2];
        const NUDGE = 60;
        let maxIdx = inter.ds.indexOf(Math.max(...inter.ds));
        let minIdx = inter.ds.indexOf(Math.min(...inter.ds));
        if (maxIdx !== minIdx && inter.durations[minIdx*2] > 120) {
            inter.durations[maxIdx*2] += NUDGE;
            inter.durations[minIdx*2] -= NUDGE;
        }
        for(let i=0; i<4; i++) inter.durations[i*2] = Math.max(120, Math.min(600, inter.durations[i*2]));
        inter.occ = [0,0,0,0];
    }

    function spawn() {
        if (Math.random() > state.spawnRate) return;
        const directions = ['N', 'S', 'E', 'W'];
        const dir = directions[Math.floor(Math.random() * 4)];
        const roadPos = (Math.floor(Math.random() * GRID_SIZE) + 0.5) * CELL_SIZE;

        let v = {
            id: Math.random(), dir: dir,
            maxSpeed: MAX_SPEED * (0.8 + Math.random() * 0.4),
            currentSpeed: 0, x: 0, y: 0, lastInterId: -1
        };

        if (dir === 'S') { v.x = roadPos - LANE_OFFSET; v.y = -30; }
        if (dir === 'N') { v.x = roadPos + LANE_OFFSET; v.y = canvas.height + 30; }
        if (dir === 'E') { v.x = -30; v.y = roadPos + LANE_OFFSET; }
        if (dir === 'W') { v.x = canvas.width + 30; v.y = roadPos - LANE_OFFSET; }

        if (!state.vehicles.some(other => Math.hypot(v.x - other.x, v.y - other.y) < 60)) {
            state.vehicles.push(v);
            state.totalVehiclesProcessed++;
        }
    }

    function update() {
        if (!state.running) return;
        spawn();

        state.intersections.forEach(inter => {
            inter.timer++;
            if (inter.timer > inter.durations[inter.phase]) {
                if (inter.phase === 7) applyGlideAdaptive(inter);
                inter.timer = 0;
                inter.phase = (inter.phase + 1) % 8;
            }
        });

        state.vehicles.forEach(v => {
            let targetSpeed = v.maxSpeed;
            
            state.intersections.forEach(inter => {
                const dist = Math.hypot(v.x - inter.x, v.y - inter.y);
                let light = 'RED';

                // ABSOLUTE MAPPING: Direction -> Phase
                const isApproaching = (v.dir === 'S' && v.y < inter.y - 20) || (v.dir === 'N' && v.y > inter.y + 20) ||
                                      (v.dir === 'E' && v.x < inter.x - 20) || (v.dir === 'W' && v.x > inter.x + 20);

                if (v.dir === 'S' && v.y < inter.y) { // From North
                    if (inter.phase === 0) light = 'GREEN'; else if (inter.phase === 1) light = 'YELLOW';
                } else if (v.dir === 'N' && v.y > inter.y) { // From South
                    if (inter.phase === 2) light = 'GREEN'; else if (inter.phase === 3) light = 'YELLOW';
                } else if (v.dir === 'E' && v.x < inter.x) { // From West
                    if (inter.phase === 4) light = 'GREEN'; else if (inter.phase === 5) light = 'YELLOW';
                } else if (v.dir === 'W' && v.x > inter.x) { // From East
                    if (inter.phase === 6) light = 'GREEN'; else if (inter.phase === 7) light = 'YELLOW';
                }

                // GLIDE Sensing
                if (isApproaching && dist < 100 && light === 'GREEN' && v.currentSpeed > 0.1) {
                    const sensorIdx = {'S':0, 'N':1, 'E':2, 'W':3}[v.dir];
                    inter.occ[sensorIdx]++;
                }

                // Turn Logic (50%)
                if (dist < 10 && v.lastInterId !== inter.id && (light === 'GREEN' || light === 'YELLOW')) {
                    v.lastInterId = inter.id;
                    if (Math.random() < 0.50) {
                        const turnRight = Math.random() < 0.5;
                        const oldDir = v.dir;
                        if (oldDir === 'N') { v.dir = turnRight ? 'E' : 'W'; v.y = inter.y + (turnRight ? LANE_OFFSET : -LANE_OFFSET); v.x = inter.x; }
                        else if (oldDir === 'S') { v.dir = turnRight ? 'W' : 'E'; v.y = inter.y + (turnRight ? -LANE_OFFSET : LANE_OFFSET); v.x = inter.x; }
                        else if (oldDir === 'E') { v.dir = turnRight ? 'S' : 'N'; v.x = inter.x + (turnRight ? -LANE_OFFSET : LANE_OFFSET); v.y = inter.y; }
                        else if (oldDir === 'W') { v.dir = turnRight ? 'N' : 'S'; v.x = inter.x + (turnRight ? LANE_OFFSET : -LANE_OFFSET); v.y = inter.y; }
                    }
                }

                if (isApproaching && dist < REACTION_DIST) {
                    if (light === 'RED') targetSpeed = 0;
                    else if (light === 'YELLOW' && dist > 50) targetSpeed = 0;
                }
            });

            // Following
            state.vehicles.forEach(other => {
                if (v.id === other.id) return;
                const dX = other.x - v.x; const dY = other.y - v.y;
                const gap = Math.hypot(dX, dY);
                let inFront = (v.dir === 'S' && Math.abs(dX) < 12 && dY > 0) || (v.dir === 'N' && Math.abs(dX) < 12 && dY < 0) ||
                               (v.dir === 'E' && Math.abs(dY) < 12 && dX > 0) || (v.dir === 'W' && Math.abs(dY) < 12 && dX < 0);
                if (inFront && gap < 70) {
                    targetSpeed = Math.min(targetSpeed, other.currentSpeed * 0.8);
                    if (gap < 45) targetSpeed = 0;
                }
            });

            v.currentSpeed += (v.currentSpeed < targetSpeed) ? ACCEL : -BRAKE_FORCE;
            v.currentSpeed = Math.max(0, v.currentSpeed);
            if (v.currentSpeed < 0.1) state.totalWaitAccumulated += (1/60);
            
            if (v.dir === 'S') v.y += v.currentSpeed; else if (v.dir === 'N') v.y -= v.currentSpeed;
            else if (v.dir === 'E') v.x += v.currentSpeed; else v.x -= v.currentSpeed;
        });

        state.vehicles = state.vehicles.filter(v => v.x > -100 && v.x < canvas.width + 100 && v.y > -100 && v.y < canvas.height + 100);
        updateUI();
    }

    function draw() {
        ctx.fillStyle = '#27ae60'; ctx.fillRect(0,0,canvas.width,canvas.height);
        for (let i = 0; i < GRID_SIZE; i++) {
            const pos = (i + 0.5) * CELL_SIZE;
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(pos - ROAD_WIDTH/2, 0, ROAD_WIDTH, canvas.height); 
            ctx.fillRect(0, pos - ROAD_WIDTH/2, canvas.width, ROAD_WIDTH); 
            ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 2; ctx.setLineDash([20, 15]);
            ctx.beginPath(); ctx.moveTo(pos, 0); ctx.lineTo(pos, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, pos); ctx.lineTo(canvas.width, pos); ctx.stroke();
            ctx.setLineDash([]);
        }

        state.intersections.forEach(inter => {
            ctx.fillStyle = '#34495e'; ctx.fillRect(inter.x - ROAD_WIDTH/2, inter.y - ROAD_WIDTH/2, ROAD_WIDTH, ROAD_WIDTH);
            const offset = ROAD_WIDTH/2 + 12;
            
            const drawLight = (lx, ly, activePhase, curT, durs) => {
                let color = '#e74c3c'; let rem = 0;
                if (inter.phase === activePhase) { 
                    color = '#2ecc71'; rem = durs[activePhase] - curT + durs[activePhase+1];
                } else if (inter.phase === activePhase + 1) { 
                    color = '#f1c40f'; rem = durs[activePhase+1] - curT;
                } else {
                    let s = (inter.phase + 1) % 8;
                    while (s !== activePhase) { rem += durs[s]; s = (s + 1) % 8; }
                    rem += (durs[inter.phase] - curT);
                }
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(lx, ly, 10, 0, 7); ctx.fill();
                ctx.fillStyle = color; ctx.beginPath(); ctx.arc(lx, ly, 8, 0, 7); ctx.fill();
                ctx.font = "bold 13px Courier"; ctx.textAlign = "center";
                ctx.fillText(Math.ceil(rem / 60), lx, ly > inter.y ? ly + 25 : ly - 15);
            };

            drawLight(inter.x - LANE_OFFSET, inter.y - offset, 0, inter.timer, inter.durations); // North approach
            drawLight(inter.x + LANE_OFFSET, inter.y + offset, 2, inter.timer, inter.durations); // South approach
            drawLight(inter.x - offset, inter.y + LANE_OFFSET, 4, inter.timer, inter.durations); // West approach
            drawLight(inter.x + offset, inter.y - LANE_OFFSET, 6, inter.timer, inter.durations); // East approach

            ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(inter.x - 35, inter.y - 18, 70, 36);
            ctx.fillStyle = "#00ff00"; ctx.font = "bold 9px monospace"; ctx.textAlign = "center";
            ctx.fillText(`N:${Math.round(inter.ds[0]*100)}% S:${Math.round(inter.ds[1]*100)}%`, inter.x, inter.y - 2);
            ctx.fillText(`W:${Math.round(inter.ds[2]*100)}% E:${Math.round(inter.ds[3]*100)}%`, inter.x, inter.y + 10);
        });

        state.vehicles.forEach(v => {
            ctx.save(); ctx.translate(v.x, v.y);
            if (v.dir === 'E') ctx.rotate(Math.PI/2); else if (v.dir === 'W') ctx.rotate(-Math.PI/2); else if (v.dir === 'N') ctx.rotate(Math.PI);
            ctx.fillStyle = '#f1c40f'; ctx.fillRect(-8, -12, 16, 24);
            ctx.restore();
        });
        if (state.running) update();
        requestAnimationFrame(draw);
    }

    function updateUI() {
        document.getElementById('vCount').textContent = state.vehicles.length;
        const totalDS = state.intersections.reduce((a, b) => a + b.ds.reduce((x,y)=>x+y,0)/4, 0);
        document.getElementById('vSat').textContent = Math.round((totalDS / 4) * 100) + "%";
        const avgS = state.vehicles.length > 0 ? (state.vehicles.reduce((a,b) => a + b.currentSpeed, 0) / state.vehicles.length) / MAX_SPEED : 1;
        document.getElementById('vCongestion').textContent = Math.round(Math.max(0, 100 - (avgS * 100))) + "%";
        const avgWait = state.totalVehiclesProcessed > 0 ? (state.totalWaitAccumulated / state.totalVehiclesProcessed) : 0;
        document.getElementById('vWait').textContent = avgWait.toFixed(1) + "s";
    }

    document.getElementById('toggleBtn').onclick = () => { state.running = !state.running; document.getElementById('toggleBtn').textContent = state.running ? "PAUSE" : "RESUME"; };
    document.getElementById('resetBtn').onclick = () => { state.vehicles = []; state.exitedCount = 0; state.totalWaitAccumulated = 0; state.totalVehiclesProcessed = 0; initIntersections(); };
    document.getElementById('spawnControl').oninput = (e) => { state.spawnRate = parseFloat(e.target.value); };
    initIntersections(); draw();
</script>
</body>
</html>
