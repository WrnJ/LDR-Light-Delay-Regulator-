<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLIDE Simulation - Fixed Detection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; }
        .container { background: #2c3e50; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        canvas { background: #34495e; border: 4px solid #444; border-radius: 8px; display: block; }
        .controls { display: flex; gap: 20px; margin-top: 15px; align-items: center; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .stat-box { background: #1a1a1a; padding: 10px; border-radius: 5px; text-align: center; border-bottom: 3px solid #f1c40f; }
        .stat-label { font-size: 10px; color: #bdc3c7; text-transform: uppercase; display: block; margin-bottom: 5px; }
        .stat-value { font-size: 18px; font-weight: bold; color: #f1c40f; display: block; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; transition: 0.2s; }
        .btn-start { background: #27ae60; color: white; }
        .btn-reset { background: #e74c3c; color: white; }
        #glide-mode { text-align: center; font-size: 12px; font-weight: bold; margin-bottom: 10px; letter-spacing: 2px; color: #2ecc71; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center; margin-bottom: 5px; letter-spacing: 2px;">GLIDE TRAFFIC ADAPTIVE (FIXED)</h2>
        <div id="glide-mode">STATUS: STABLE ROTATION</div>
        <canvas id="trafficCanvas" width="800" height="800"></canvas>
        
        <div class="controls">
            <button class="btn-start" id="toggleBtn">START SIMULATION</button>
            <button class="btn-reset" id="resetBtn">RESET</button>
            <div style="flex-grow: 1">
                <span style="font-size: 12px; display: block; margin-bottom: 5px;">FLOW DENSITY</span>
                <input type="range" id="spawnControl" min="0.005" max="0.15" step="0.005" value="0.03" style="width: 100%">
            </div>
        </div>

        <div class="stats">
            <div class="stat-box"><span class="stat-label">Active Cars</span><span id="vCount" class="stat-value">0</span></div>
            <div class="stat-box"><span class="stat-label">Wallet</span><span id="vWallet" class="stat-value">SMALL</span></div>
            <div class="stat-box"><span class="stat-label">Saturation</span><span id="vCongestion" class="stat-value">0%</span></div>
            <div class="stat-box"><span class="stat-label">Avg Wait</span><span id="vWait" class="stat-value">0.0s</span></div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('trafficCanvas');
    const ctx = canvas.getContext('2d');

    const GRID_SIZE = 2; 
    const ROAD_WIDTH = 80;
    const LANE_OFFSET = 20; 
    const CELL_SIZE = canvas.width / GRID_SIZE;
    const FPS = 60;
    
    // --- LIMITS & THRESHOLDS ---
    const MIN_GREEN = 90; // 1.5s
    const YELLOW_TIME = 60; // 1s
    const REACTION_DIST = 100;
    
    const MAX_SPEED = 2.4; 
    const ACCEL = 0.06;     
    const BRAKE_FORCE = 0.2; 

    let state = {
        running: false,
        vehicles: [],
        intersections: [],
        spawnRate: 0.03,
        totalWaitAccumulated: 0,
        totalVehiclesProcessed: 0
    };

    function initIntersections() {
        state.intersections = [];
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                state.intersections.push({
                    x: (c + 0.5) * CELL_SIZE,
                    y: (r + 0.5) * CELL_SIZE,
                    timer: 0,
                    phase: 0, 
                    // Phase logic: 0:N-G, 1:N-Y, 2:S-G, 3:S-Y, 4:E-G, 5:E-Y, 6:W-G, 7:W-Y
                    durations: [180, 60, 180, 60, 180, 60, 180, 60],
                    occ: [0, 0, 0, 0], 
                    ds: [0, 0, 0, 0],
                    walletMode: "SMALL",
                    id: r * GRID_SIZE + c
                });
            }
        }
    }

    function applyAdaptiveLogic(inter) {
        // Calculate saturation (Used frames / Allocated frames)
        for(let i=0; i<4; i++) inter.ds[i] = inter.occ[i] / inter.durations[i*2];
        let peakSat = Math.max(...inter.ds);

        // --- THE 2 WALLET CYCLE SCALING ---
        if (peakSat > 0.65 && inter.walletMode === "SMALL") {
            inter.walletMode = "LARGE";
            for(let i=0; i<4; i++) inter.durations[i*2] = 420; // Rebase to 7s
        } else if (peakSat < 0.20 && inter.walletMode === "LARGE") {
            inter.walletMode = "SMALL";
            for(let i=0; i<4; i++) inter.durations[i*2] = 180; // Rebase to 3s
        }

        // --- GLIDE 1S NUDGING ---
        const NUDGE = 60;
        let maxIdx = inter.ds.indexOf(peakSat);
        let minIdx = inter.ds.indexOf(Math.min(...inter.ds));
        if (maxIdx !== minIdx && inter.durations[minIdx*2] > MIN_GREEN) {
            inter.durations[maxIdx*2] += NUDGE;
            inter.durations[minIdx*2] -= NUDGE;
        }

        // Stability Clamp
        for(let i=0; i<4; i++) inter.durations[i*2] = Math.max(MIN_GREEN, inter.durations[i*2]);

        inter.occ = [0, 0, 0, 0];
    }

    function spawn() {
        if (Math.random() > state.spawnRate) return;
        const dir = ['N', 'S', 'E', 'W'][Math.floor(Math.random() * 4)];
        const roadPos = (Math.floor(Math.random() * GRID_SIZE) + 0.5) * CELL_SIZE;

        let v = {
            id: Math.random(), dir: dir,
            maxSpeed: MAX_SPEED * (0.9 + Math.random() * 0.3),
            currentSpeed: 0, x: 0, y: 0, lastInterId: -1
        };

        if (dir === 'S') { v.x = roadPos - LANE_OFFSET; v.y = -40; }
        if (dir === 'N') { v.x = roadPos + LANE_OFFSET; v.y = canvas.height + 40; }
        if (dir === 'E') { v.x = -40; v.y = roadPos + LANE_OFFSET; }
        if (dir === 'W') { v.x = canvas.width + 40; v.y = roadPos - LANE_OFFSET; }

        if (!state.vehicles.some(other => Math.hypot(v.x - other.x, v.y - other.y) < 55)) {
            state.vehicles.push(v);
            state.totalVehiclesProcessed++;
        }
    }

    function update() {
        if (!state.running) return;
        spawn();

        state.intersections.forEach(inter => {
            inter.timer++;
            if (inter.timer >= inter.durations[inter.phase]) {
                if (inter.phase === 7) applyAdaptiveLogic(inter);
                inter.timer = 0;
                inter.phase = (inter.phase + 1) % 8;
            }
        });

        state.vehicles.forEach(v => {
            let targetSpeed = v.maxSpeed;
            
            state.intersections.forEach(inter => {
                const dist = Math.hypot(inter.x - v.x, inter.y - v.y);
                let light = 'RED';

                // --- DIRECTION TO PHASE MAPPING ---
                const phase = inter.phase;
                if (v.dir === 'S' && v.y < inter.y) { // From North
                    if (phase === 0) light = 'GREEN'; else if (phase === 1) light = 'YELLOW';
                } else if (v.dir === 'N' && v.y > inter.y) { // From South
                    if (phase === 2) light = 'GREEN'; else if (phase === 3) light = 'YELLOW';
                } else if (v.dir === 'E' && v.x < inter.x) { // From West
                    if (phase === 4) light = 'GREEN'; else if (phase === 5) light = 'YELLOW';
                } else if (v.dir === 'W' && v.x > inter.x) { // From East
                    if (phase === 6) light = 'GREEN'; else if (phase === 7) light = 'YELLOW';
                }

                const apprx = (v.dir === 'S' && v.y < inter.y - 25) || (v.dir === 'N' && v.y > inter.y + 25) ||
                                (v.dir === 'E' && v.x < inter.x - 25) || (v.dir === 'W' && v.x > inter.x + 25);

                // GLIDE Sensing
                if (apprx && dist < 120 && light === 'GREEN' && v.currentSpeed > 0.1) {
                    const sIdx = {'S':0, 'N':1, 'E':2, 'W':3}[v.dir];
                    inter.occ[sIdx]++;
                }

                // 50% Probability Turn Logic
                if (dist < 25 && v.lastInterId !== inter.id && (light === 'GREEN' || light === 'YELLOW')) {
                    v.lastInterId = inter.id;
                    if (Math.random() < 0.50) { 
                        const choices = (v.dir === 'N' || v.dir === 'S') ? ['E','W'] : ['N','S'];
                        v.dir = choices[Math.floor(Math.random() * 2)];
                        // Re-snap to intersection center to avoid drift
                        if (v.dir === 'S' || v.dir === 'N') v.x = (v.dir === 'S') ? inter.x - LANE_OFFSET : inter.x + LANE_OFFSET;
                        if (v.dir === 'E' || v.dir === 'W') v.y = (v.dir === 'E') ? inter.y + LANE_OFFSET : inter.y - LANE_OFFSET;
                    }
                }

                if (apprx && dist < REACTION_DIST) {
                    if (light === 'RED') targetSpeed = 0;
                    else if (light === 'YELLOW' && dist > 55) targetSpeed = 0;
                }
            });

            // Physics (Bumper Protection)
            state.vehicles.forEach(other => {
                if (v.id === other.id) return;
                const gap = Math.hypot(other.x - v.x, other.y - v.y);
                let inFront = (v.dir === 'S' && Math.abs(other.x-v.x) < 12 && other.y > v.y) || 
                               (v.dir === 'N' && Math.abs(other.x-v.x) < 12 && other.y < v.y) ||
                               (v.dir === 'E' && Math.abs(other.y-v.y) < 12 && other.x > v.x) || 
                               (v.dir === 'W' && Math.abs(other.y-v.y) < 12 && other.x < v.x);
                if (inFront && gap < 70) {
                    targetSpeed = Math.min(targetSpeed, other.currentSpeed * 0.85);
                    if (gap < 48) targetSpeed = 0;
                }
            });

            v.currentSpeed += (v.currentSpeed < targetSpeed) ? ACCEL : -BRAKE_FORCE;
            v.currentSpeed = Math.max(0, v.currentSpeed);
            if (v.currentSpeed < 0.1) state.totalWaitAccumulated += (1/60);
            
            if (v.dir === 'S') v.y += v.currentSpeed; else if (v.dir === 'N') v.y -= v.currentSpeed;
            else if (v.dir === 'E') v.x += v.currentSpeed; else v.x -= v.currentSpeed;
        });

        state.vehicles = state.vehicles.filter(v => v.x > -100 && v.x < canvas.width + 100 && v.y > -100 && v.y < canvas.height + 100);
        updateUI();
    }

    function draw() {
        ctx.fillStyle = '#27ae60'; ctx.fillRect(0,0,canvas.width,canvas.height);
        for (let i = 0; i < GRID_SIZE; i++) {
            const pos = (i + 0.5) * CELL_SIZE;
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(pos - ROAD_WIDTH/2, 0, ROAD_WIDTH, canvas.height); 
            ctx.fillRect(0, pos - ROAD_WIDTH/2, canvas.width, ROAD_WIDTH); 
            ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 1; ctx.setLineDash([15, 10]);
            ctx.beginPath(); ctx.moveTo(pos, 0); ctx.lineTo(pos, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, pos); ctx.lineTo(canvas.width, pos); ctx.stroke();
            ctx.setLineDash([]);
        }

        state.intersections.forEach(inter => {
            ctx.fillStyle = '#34495e'; ctx.fillRect(inter.x - ROAD_WIDTH/2, inter.y - ROAD_WIDTH/2, ROAD_WIDTH, ROAD_WIDTH);
            const edge = ROAD_WIDTH/2;
            
            const drawLaneLamp = (lx, ly, actPh, curT, durs) => {
                let color = '#e74c3c'; let rem = 0;
                if (inter.phase === actPh) { color = '#2ecc71'; rem = durs[actPh] - curT + durs[actPh+1]; }
                else if (inter.phase === actPh + 1) { color = '#f1c40f'; rem = durs[actPh+1] - curT; }
                else {
                    let s = (inter.phase + 1) % 8;
                    while (s !== actPh) { rem += durs[s]; s = (s + 1) % 8; }
                    rem += (durs[inter.phase] - curT);
                }
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(lx, ly, 10, 0, 7); ctx.fill();
                ctx.fillStyle = color; ctx.beginPath(); ctx.arc(lx, ly, 8, 0, 7); ctx.fill();
                ctx.font = "bold 13px Courier"; ctx.textAlign = "center";
                ctx.fillText(Math.ceil(rem / 60), lx, ly > inter.y ? ly + 25 : ly - 15);
            };

            drawLaneLamp(inter.x - LANE_OFFSET, inter.y - edge - 10, 0, inter.timer, inter.durations); // N 
            drawLaneLamp(inter.x + LANE_OFFSET, inter.y + edge + 10, 2, inter.timer, inter.durations); // S 
            drawLaneLamp(inter.x - edge - 10, inter.y + LANE_OFFSET, 4, inter.timer, inter.durations); // W 
            drawLaneLamp(inter.x + edge + 10, inter.y - LANE_OFFSET, 6, inter.timer, inter.durations); // E 

            ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(inter.x - 35, inter.y - 18, 70, 36);
            ctx.fillStyle = "#00ff00"; ctx.font = "bold 9px monospace"; ctx.textAlign = "center";
            ctx.fillText(`N:${Math.round(inter.ds[0]*100)}% S:${Math.round(inter.ds[1]*100)}%`, inter.x, inter.y - 2);
            ctx.fillText(`W:${Math.round(inter.ds[2]*100)}% E:${Math.round(inter.ds[3]*100)}%`, inter.x, inter.y + 10);
        });

        state.vehicles.forEach(v => {
            ctx.save(); ctx.translate(v.x, v.y);
            if (v.dir === 'E') ctx.rotate(Math.PI/2); else if (v.dir === 'W') ctx.rotate(-Math.PI/2); else if (v.dir === 'N') ctx.rotate(Math.PI);
            ctx.fillStyle = '#f1c40f'; ctx.fillRect(-8, -12, 16, 24);
            ctx.restore();
        });
        if (state.running) update();
        requestAnimationFrame(draw);
    }

    function updateUI() {
        document.getElementById('vCount').textContent = state.vehicles.length;
        const main = state.intersections[0];
        document.getElementById('vWallet').textContent = main.walletMode;
        const avgSat = state.intersections.reduce((a,b)=>a+(b.ds.reduce((x,y)=>x+y,0)/4),0)/GRID_SIZE**2;
        document.getElementById('vCongestion').textContent = Math.round(avgSat*100) + "%";
        const avgWait = state.totalVehiclesProcessed > 0 ? (state.totalWaitAccumulated / state.totalVehiclesProcessed) : 0;
        document.getElementById('vWait').textContent = avgWait.toFixed(1) + "s";
        document.getElementById('glide-mode').textContent = `MODE: ${main.walletMode} CYCLE DETECTED`;
        document.getElementById('glide-mode').style.color = main.walletMode === 'SMALL' ? '#2ecc71' : '#f1c40f';
    }

    document.getElementById('toggleBtn').onclick = () => { state.running = !state.running; document.getElementById('toggleBtn').textContent = state.running ? "PAUSE SIMULATION" : "RESUME SIMULATION"; };
    document.getElementById('resetBtn').onclick = () => { state.vehicles = []; state.exitedCount = 0; state.totalWaitAccumulated = 0; state.totalVehiclesProcessed = 0; initIntersections(); };
    document.getElementById('spawnControl').oninput = (e) => { state.spawnRate = parseFloat(e.target.value); };
    initIntersections(); draw();
</script>
</body>
</html>
